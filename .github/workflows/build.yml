name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ExpenseTracker-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-APK
          path: out/*.apk

      # Play Store bundle (.aab). Signed with the upload key from repo secrets
      # (UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD).
      # Without those secrets it is signed with the old key.
      - name: Build Play Store bundle (AAB)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
            echo "Signing bundle with the upload key"
          else
            echo "::warning::Upload key secrets not set; bundle signed with the old key"
          fi
          gradle bundleRelease -PplayUpload --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab out/ExpenseTracker-v1.0.${{ github.run_number }}.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-AAB-PlayStore
          path: out/*.aab

      - name: Publish release (direct APK download link)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Expense Tracker v1.0.${{ github.run_number }}
          body: |
            Download the APK below on your phone and install it.
            Commit: ${{ github.sha }}
          files: out/*.apk
          make_latest: true

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Render screenshots
        run: gradle recordRoborazziDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/

      - name: Publish screenshots to the 'screenshots' branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          set -e
          mkdir -p /tmp/shots && cp app/build/outputs/roborazzi/*.png /tmp/shots/ || exit 0
          cd /tmp/shots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A && git commit -q -m "Screenshots for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screenshots
